{
  "schema": {"schema_id": "zeroinput_pinyin", "name": "ZeroInput 全拼", "version": "2.0"},
  "switches": [
    {"name": "ascii_mode", "reset": 0},
    {"name": "simplification", "reset": 1},
    {"name": "ascii_punct", "reset": 0}
  ],
  "engine": {
    "processors": ["ascii_composer", "speller", "punctuator", "selector", "navigator", "express_editor"],
    "segmentors": ["ascii_segmentor", "abc_segmentor", "punct_segmentor", "fallback_segmentor"],
    "translators": ["punct_translator", "script_translator"],
    "filters": ["simplifier", "uniquifier"]
  },
  "speller": {
    "alphabet": "abcdefghijklmnopqrstuvwxyz",
    "delimiter": " '",
    "algebra": ["abbrev/^([a-z]).+$/$1/", "abbrev/^([zcs]h).+$/$1/"]
  },
  "translator": {
    "dictionary": "zeroinput_public", "prism": "zeroinput_pinyin",
    "enable_completion": true, "enable_sentence": true, "enable_user_dict": false,
    "always_show_comments": true, "spelling_hints": 64
  },
  "simplifier": {"opencc_config": "t2s.json", "tips": "none", "inherit_comment": true},
  "grammar": {
    "language": "wanxiang-lts-zh-hans",
    "collocation_max_length": 6, "collocation_min_length": 2,
    "collocation_penalty": -14, "non_collocation_penalty": -6,
    "weak_collocation_penalty": -100, "rear_penalty": -18
  },
  "menu": {"page_size": 8},
  "editor": {"bindings": {"Return": "commit_composition"}},
  "punctuator": {
    "half_shape": {
      ",": "，", ".": "。", "?": "？", "!": "！", ":": "：", ";": "；",
      "(": "（", ")": "）", "[": "【", "]": "】"
    }
  }
}
