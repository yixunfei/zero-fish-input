name: Review public dictionary updates
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'
permissions:
  contents: read
concurrency:
  group: public-dictionary-update
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify update failure and branch ownership regressions
        run: python3 -m unittest discover -s tools/dictionaries -p 'test_*.py' -v
      - name: Resolve, verify and convert complete Wanxiang data
        run: python3 tools/dictionaries/prepare.py --refresh
      - name: Verify deterministic prepared artifacts
        run: python3 tools/dictionaries/verify.py
      - name: Prepare updated optional LTS resource manifest
        run: python3 tools/resources/prepare.py --lts-only
      - name: Bootstrap pinned native sources
        shell: pwsh
        run: ./tools/bootstrap-rime.ps1
      - name: Rebuild matching default Rime artifacts
        run: |
          cmake -S tools/rime-prebuilt -B build/rime-prebuilt-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DZEROINPUT_THIRD_PARTY_DIR="$PWD/third_party"
          cmake --build build/rime-prebuilt-linux --target rime_deployer --parallel 4
          python3 tools/rime-prebuilt/generate.py --container
          python3 tools/rime-prebuilt/verify.py
      - name: Propose reviewed source lock update
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash tools/dictionaries/propose-update.sh
      - name: Report scheduled update availability
        if: github.event_name == 'schedule'
        run: |
          if git diff --quiet -- tools/dictionaries/sources.lock.json tools/resources/catalog.json engine-rime/prebuilt/rime/prebuilt; then
            echo 'No pinned dictionary update is available.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'A dictionary update is available. Run this workflow manually to open a review PR.' >> "$GITHUB_STEP_SUMMARY"
          fi
