name: Publish reviewed public resources
on:
  workflow_dispatch:
    inputs:
      reviewed_ref:
        description: Full reviewed commit SHA reachable from main, containing the source lock and resource catalog
        required: true
permissions: {}
concurrency:
  group: publish-public-resources
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      reviewed_commit: ${{ steps.review.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate reviewed commit ancestry
        id: review
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_ref }}
        run: |
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$REVIEWED_COMMIT^{commit}"
          git merge-base --is-ancestor "$REVIEWED_COMMIT" origin/main
          git checkout --detach "$REVIEWED_COMMIT"
          echo "commit=$REVIEWED_COMMIT" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Prepare pinned public resources
        run: |
          python3 -m venv "$RUNNER_TEMP/resource-build"
          source "$RUNNER_TEMP/resource-build/bin/activate"
          python3 -m pip install --require-hashes --only-binary=:all: -r tools/resources/requirements-linux-cpu.txt
          python3 tools/dictionaries/prepare.py
          python3 tools/prepare-handwriting-model.py
          python3 tools/resources/prepare-mini.py
          cp tools/resources/catalog.json /tmp/reviewed-resource-catalog.json
          python3 tools/resources/prepare.py
          python3 -c "import json; assert json.load(open('tools/resources/catalog.json')) == json.load(open('/tmp/reviewed-resource-catalog.json'))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-public-resources
          if-no-files-found: error
          retention-days: 1
          path: |
            build/public-resources/*.zip
            build/handwriting-stroke-model/*.zip
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck reviewed commit before publication
        env:
          REVIEWED_COMMIT: ${{ needs.build.outputs.reviewed_commit }}
        run: |
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$REVIEWED_COMMIT" origin/main
          git checkout --detach "$REVIEWED_COMMIT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reviewed-public-resources
          path: build
      - name: Publish immutable data assets and corresponding sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/resources/publish.py
